import groovy.json.JsonSlurper
import com.modrinth.minotaur.ModrinthExtension
import com.modrinth.minotaur.TaskModrinthUpload
import java.nio.file.Path
import org.gradle.api.file.ConfigurableFileCollection
import org.gradle.api.internal.file.UnionFileCollection

plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.43-kappa'
    id 'com.gradleup.shadow' version '9.2.2'
    id 'com.modrinth.minotaur' version '2.10.0' apply false
}

def matrix = new JsonSlurper().parse(file('versions.json'))
def mc = providers.gradleProperty('mcVersion').get()
def platform = providers.gradleProperty('loader').get()
if (!matrix.containsKey(mc) || !(platform in ['fabric', 'neoforge'])) {
    throw new GradleException('Use -PmcVersion=1.21.1|26.1.2|26.2|26.3 -Ploader=fabric|neoforge')
}
def target = matrix[mc]
def integration = providers.gradleProperty('selfTest').map { it.toBoolean() }.getOrElse(false)
def startup = providers.gradleProperty('startupTest').map { it.toBoolean() }.getOrElse(false)
def hotReload = providers.gradleProperty('hotReload').map { it.toBoolean() }.getOrElse(true) && !integration && !startup
if (integration && startup) throw new GradleException('Choose selfTest or startupTest, not both')
group = 'dev.ricky12awesome.lodgen'
version = providers.gradleProperty('modVersion').get()
base.archivesName = "lodgen-${mc}-${platform}"
layout.buildDirectory = file("build/${mc}/${platform}" + (integration ? '/selftest' : startup ? '/startup' : ''))

sourceSets.main.java.srcDirs('src/common/java', "src/${platform}/java", layout.buildDirectory.dir('generated/sources/minecraft'))
sourceSets.main.resources.srcDirs('src/common/resources', "src/${platform}/resources")
sourceSets.create('clientHotReload') {
    java.srcDir('src/clientHotReload/java')
}
if (integration) sourceSets.main.java.srcDirs('src/integration/java', "src/integration/${platform}/java")
if (startup) sourceSets.main.resources.srcDir('src/startup/resources')

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.neoforged.net/releases/' }
}

configurations {
    bundled
    implementation.extendsFrom(bundled)
    modCompileOnly
    compileOnly.extendsFrom(modCompileOnly)
    modRuntimeOnly
    runtimeOnly.extendsFrom(modRuntimeOnly)
    dhRuntime
    runtimeOnly.extendsFrom(dhRuntime)
}

unimined.minecraft {
    version mc
    if (mc == '1.21.1') {
        mappings { mojmap(); devNamespace 'mojmap' }
    }
    if (platform == 'fabric') {
        fabric { loader target.fabricLoader }
        mods {
            remap([project.configurations.modCompileOnly, project.configurations.modRuntimeOnly]) {
                if (mc == '1.21.1') {
                    mixinRemap {
                        // Fabric API's MixinExtras selectors must use Mojang names too.
                        enableMixinExtra()
                    }
                }
            }
            if (mc == '1.21.1') {
                remap(project.configurations.dhRuntime) {
                    // DH also ships a NeoForge widener in the named namespace.
                    catchAWNamespaceAssertion()
                }
            }
        }
    } else {
        def prefix = mc == '1.21.1' ? '21.1.' : (mc == '26.1.2' ? '26.1.2.' : "${mc}.0.")
        neoForged { loader target.neoForge.substring(prefix.length()); useToolchains = false }
    }
}

// Unimined adds Fabric's development mappings as a raw Path. IntelliJ 2026.2
// treats Path as Iterable and recurses until its dependency importer overflows.
// Keep the classpath structure, but expose that entry as a Gradle RegularFile.
if (platform == 'fabric') {
    afterEvaluate {
        def normalizePaths
        normalizePaths = { classpath ->
            if (classpath instanceof ConfigurableFileCollection) {
                classpath.setFrom(classpath.from.collect { entry ->
                    entry instanceof Path ? layout.projectDirectory.file(entry.toString()) : entry
                })
            } else if (classpath instanceof UnionFileCollection) {
                classpath.sources.each { normalizePaths(it) }
            }
        }
        normalizePaths(sourceSets.main.runtimeClasspath)
    }
}

dependencies {
    if (platform == 'fabric') {
        // Only Mod Menu loads its config entrypoint. Keep its API out of implementation.
        modCompileOnly("maven.modrinth:modmenu:${target.modMenu}") { transitive = false }
        modRuntimeOnly("maven.modrinth:modmenu:${target.modMenu}") { transitive = false }
        // The dev mods use Fabric API; production LODgen only uses Fabric Loader.
        modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
        if (integration) modCompileOnly "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
    }
    bundled 'com.electronwill.night-config:toml:3.9.0'
    compileOnly "maven.modrinth:distanthorizons:${target.dh}"
    dhRuntime "maven.modrinth:distanthorizons:${target.dh}"
    testImplementation dependencies.platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.ow2.asm:asm-tree:9.9.1'
    testImplementation 'org.xerial:sqlite-jdbc:3.49.1.0'
    testImplementation "maven.modrinth:distanthorizons:${target.dh}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.9'
    testRuntimeOnly 'org.apache.logging.log4j:log4j-core:2.25.2'
    if (integration) {
        modRuntimeOnly "maven.modrinth:c2me-${platform}:${target[platform == 'fabric' ? 'c2meFabric' : 'c2meNeoForge']}"
    }
}

// Only Minecraft and loader API changes are conditional. Generation scheduling, DH
// integration, configuration, and platform-independent tests share one source tree.
def generated = layout.buildDirectory.dir('generated/sources/minecraft')
def minecraftFlags = [MC_1211: mc == '1.21.1', MC_1211_FABRIC: mc == '1.21.1' && platform == 'fabric', MC_263: mc == '26.3', MC_26: mc != '1.21.1', MC_262_PLUS: mc in ['26.2', '26.3'], NEOFORGE: platform == 'neoforge']
def preprocess = tasks.register('preprocessMinecraft') {
    inputs.dir('src/minecraft/java')
    inputs.property('mc', mc)
    inputs.property('loader', platform)
    inputs.property('startup', startup)
    if (startup) inputs.dir('src/startup/java')
    outputs.dir(generated)
    doLast {
        delete(generated)
        def roots = [file('src/minecraft/java')]
        if (startup) roots.add(file('src/startup/java'))
        roots.each { sourceRoot ->
            fileTree(sourceRoot).matching { include '**/*.java' }.each { input ->
                def active = [true]
                def output = []
                input.eachLine { line ->
                    def directive = line.trim()
                    if (directive.startsWith('// #if ')) {
                        def flag = directive.substring(7)
                        def enabled = minecraftFlags[flag]
                        if (enabled == null) throw new GradleException("Unknown preprocessor flag ${flag}")
                        active.add(active.last() && enabled)
                    } else if (directive == '// #else') {
                        active[-1] = active[-2] && !active[-1]
                    } else if (directive == '// #endif') {
                        active.removeLast()
                    } else if (active.last()) {
                        output.add(line)
                    }
                }
                if (active.size() != 1) throw new GradleException("Unclosed condition in ${input}")
                def out = new File(generated.get().asFile, sourceRoot.toPath().relativize(input.toPath()).toString())
                out.parentFile.mkdirs()
                out.text = output.join('\n') + '\n'
            }
        }
    }
}
sourceSets.test.java.srcDirs('src/test/java')
// Translation/rendering checks exercise Minecraft's text visitors without a client window.
// Reuse its libraries, including Gson, so tests do not shadow Minecraft's versions.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
if (integration) sourceSets.test.java.srcDir('src/integrationTest/java')
tasks.named('compileJava') { dependsOn(preprocess) }
java { toolchain.languageVersion = JavaLanguageVersion.of(target.java as int) }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = target.java as int
    // Variant switches and removed source files otherwise leave stale classes in
    // Unimined's shared execution history. Compile into a clean class directory.
    options.incremental = false
    inputs.property('cleanClassOutput', 1)
    outputs.cacheIf { false }
    doFirst { delete(destinationDirectory) }
}
tasks.named('test') {
    useJUnitPlatform()
    workingDir(layout.buildDirectory.dir('unit-test-run'))
    doFirst { workingDir.mkdirs() }
}
// This agent is a separate source set and never enters the distributable mod.
def clientHotReloadJar = tasks.register('clientHotReloadJar', Jar) {
    from(sourceSets.clientHotReload.output)
    archiveFileName = 'lodgen-client-hot-reload-agent.jar'
    destinationDirectory = layout.buildDirectory.dir('client-hot-reload')
    manifest.attributes(
            'Premain-Class': 'dev.ricky12awesome.lodgen.dev.ClientHotReloadAgent',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true')
}
tasks.named('test') {
    dependsOn(clientHotReloadJar)
    systemProperty 'lodgen.hotReloadAgentJar', clientHotReloadJar.flatMap { it.archiveFile }.get().asFile.absolutePath
}
if (hotReload) {
    def reloadConfig = layout.buildDirectory.file('client-hot-reload/client.properties')
    def prepareClientHotReload = tasks.register('prepareClientHotReload') {
        dependsOn(tasks.named('classes'), clientHotReloadJar)
        // Export the resolved classpath each launch, including selected mappings.
        doLast {
            def config = new Properties()
            config.setProperty('javaRoots', sourceSets.main.java.srcDirs.findAll { it != generated.get().asFile }.collect { it.absolutePath }.join('\n'))
            config.setProperty('preprocessRoots', file('src/minecraft/java').absolutePath)
            config.setProperty('resourceRoots', sourceSets.main.resources.srcDirs.collect { it.absolutePath }.join('\n'))
            config.setProperty('classOutput', tasks.named('compileJava', JavaCompile).get().destinationDirectory.get().asFile.absolutePath)
            config.setProperty('resourceOutput', tasks.named('processResources').get().destinationDir.absolutePath)
            config.setProperty('stagingDirectory', layout.buildDirectory.dir('client-hot-reload/staging').get().asFile.absolutePath)
            config.setProperty('compileClasspath', tasks.named('compileJava', JavaCompile).get().classpath.asPath)
            config.setProperty('release', target.java.toString())
            minecraftFlags.each { flag, enabled -> config.setProperty("flag.${flag}".toString(), enabled.toString()) }
            reloadConfig.get().asFile.withOutputStream { config.store(it, 'Client hot reload; generated by Gradle') }
        }
    }
    tasks.named('runClient') {
        dependsOn(prepareClientHotReload)
        doFirst {
            def mixinAgent = classpath.files.find { entry ->
                if (!entry.name.endsWith('.jar')) return false
                new java.util.jar.JarFile(entry).withCloseable { jar ->
                    jar.manifest?.mainAttributes?.getValue('Premain-Class') == 'org.spongepowered.tools.agent.MixinAgent'
                }
            }
            if (mixinAgent == null) throw new GradleException('The client Mixin Java agent was not found on its runtime classpath')
            jvmArgs "-javaagent:${mixinAgent.absolutePath}", "-javaagent:${clientHotReloadJar.get().archiveFile.get().asFile.absolutePath}=${reloadConfig.get().asFile.absolutePath}"
            jvmArgs '-Dmixin.hotSwap=true'
        }
    }
}
tasks.named('processResources') {
    def values = [version: version, minecraft: mc, loader: platform, java: target.java, dhVersion: target.dhVersion, fabricLoader: target.fabricLoader]
    inputs.properties(values)
    inputs.property('integration', integration)
    inputs.property('startup', startup)
    filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml', 'lodgen.target.properties']) { expand(values) }
    if (integration) {
        doLast {
            def metadata = new File(destinationDir, 'lodgen.mixins.json')
            def json = new JsonSlurper().parse(metadata)
            json.plugin = 'dev.ricky12awesome.lodgen.integration.IntegrationMixinPlugin'
            metadata.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
        }
    }
    if (integration && platform == 'fabric') {
        doLast {
            def metadata = new File(destinationDir, 'fabric.mod.json')
            def json = new JsonSlurper().parse(metadata)
            json.entrypoints.main.add('dev.ricky12awesome.lodgen.integration.fabric.IntegrationEntrypoint')
            metadata.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
        }
    }
    if (startup) {
        doLast {
            if (platform == 'fabric') {
                def metadata = new File(destinationDir, 'fabric.mod.json')
                def json = new JsonSlurper().parse(metadata)
                json.mixins.add('lodgen.startup.mixins.json')
                metadata.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
            } else {
                new File(destinationDir, 'META-INF/neoforge.mods.toml').append('\n[[mixins]]\nconfig="lodgen.startup.mixins.json"\n')
            }
        }
    }
}
tasks.named('jar') { from('LICENSE') }
tasks.named('shadowJar') {
    configurations = [project.configurations.bundled]
    archiveClassifier = 'bundled-dev'
    relocate 'com.electronwill.nightconfig', 'dev.ricky12awesome.lodgen.libs.nightconfig'
    from('LICENSE')
    exclude 'META-INF/maven/**', 'module-info.class'
}
tasks.named('remapJar') {
    dependsOn(tasks.named('shadowJar'))
    inputFile.set(tasks.named('shadowJar').flatMap { it.archiveFile })
}

// Credentials stay in the ignored .env file or the process environment.
// Read values as data, without executing shell commands from .env.
def modrinthEnv = providers.fileContents(layout.projectDirectory.file('.env')).asText.orElse('').map { contents ->
    contents.readLines().collectEntries { line ->
        def entry = line.trim().replaceFirst(/^export\s+/, '').split('=', 2)
        if (entry.length != 2 || !(entry[0].trim() in ['MODRINTH_PROJECT_ID', 'MODRINTH_TOKEN', 'MODRINTH_PAT'])) return [:]
        def value = entry[1].trim()
        if (value.length() >= 2 && ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'")))) {
            value = value.substring(1, value.length() - 1)
        } else {
            value = value.replaceFirst(/\s+#.*$/, '').trim()
        }
        [(entry[0].trim()): value]
    }
}
def voxyTarget = new JsonSlurper().parse(file('voxy-versions.json'))[mc]?.get(platform)
// Ignore build metadata and classify the first prerelease identifier.
def versionParts = version.toString().split(/\+/, 2)[0].split('-', 2)
def versionQualifier = versionParts.length > 1 ? versionParts[1].split(/[.-]/, 2)[0] : ''
// Register Minotaur's extension and uploader under our publishing task name.
extensions.create('modrinth', ModrinthExtension, project)
modrinth {
    token.set(providers.environmentVariable('MODRINTH_TOKEN')
            .orElse(providers.environmentVariable('MODRINTH_PAT'))
            .orElse(modrinthEnv.map { it.MODRINTH_TOKEN ?: it.MODRINTH_PAT ?: '' }))
    projectId.set(providers.gradleProperty('modrinthProjectId')
            .orElse(providers.environmentVariable('MODRINTH_PROJECT_ID'))
            .orElse(modrinthEnv.map { it.MODRINTH_PROJECT_ID ?: '' }))
    // Each target gets its own version so publishing the matrix cannot collide.
    versionNumber = "${version}+${mc}-${platform}"
    versionName = "LODgen ${version} — Minecraft ${mc} (${platform == 'fabric' ? 'Fabric' : 'NeoForge'})"
    versionType = versionQualifier in ['alpha', 'beta'] ? versionQualifier : 'release'
    environment.set(providers.gradleProperty('modrinthEnvironment').orElse('client_or_server_prefers_both'))
    file.set(tasks.named('remapJar').flatMap { it.archiveFile })
    gameVersions = [mc]
    loaders = [platform]
    detectLoaders = false
    debugMode.set(providers.gradleProperty('modrinthDebug').map { it.toBoolean() }.orElse(false))
    if (providers.gradleProperty('modrinthChangelogFile').isPresent()) {
        changelog.set(providers.fileContents(layout.projectDirectory.file(providers.gradleProperty('modrinthChangelogFile').get())).asText)
    }
    dependencies {
        optional.version target.dh
        optional.version target[platform == 'fabric' ? 'c2meFabric' : 'c2meNeoForge']
        if (platform == 'fabric') optional.version target.modMenu
        if (voxyTarget) {
            optional.version voxyTarget.voxy
            if (voxyTarget.roxy) optional.version voxyTarget.roxy
        }
        if (mc == '1.21.1' && platform == 'neoforge') optional.version 'ysVSK5wH'
    }
}
tasks.register('publishModrinth', TaskModrinthUpload) {
    group = 'publishing'
    description = 'Build, test, and publish the selected Minecraft/loader target to Modrinth.'
    dependsOn(tasks.named('assemble'), tasks.named('check'))
    mustRunAfter(tasks.named('build'))
    wiredInputFiles.from(modrinth.file)
    inputs.property('changelog', modrinth.changelog).optional(true)
    notCompatibleWithConfigurationCache('Minotaur accesses the project during upload')
    doFirst {
        if (integration || startup) throw new GradleException('Publish with selfTest=false and startupTest=false; test variants are not releases')
        if (!modrinth.projectId.get().trim()) throw new GradleException('Set MODRINTH_PROJECT_ID in .env or the environment, or use -PmodrinthProjectId=<id>')
        if (!modrinth.debugMode.get() && !modrinth.token.get().trim()) throw new GradleException('Set MODRINTH_PAT or MODRINTH_TOKEN in .env or the environment before publishing')
    }
}

// Each nested build selects one target. Chain them to protect shared build caches
// and stop publishing subsequent targets if a build or upload fails.
def previousPublication = null
matrix.keySet().each { gameVersion ->
    ['fabric', 'neoforge'].each { loaderName ->
        def priorPublication = previousPublication
        previousPublication = tasks.register("modrinthMatrix${gameVersion.replace('.', '_')}${loaderName.capitalize()}", GradleBuild) {
            dir = rootProject.projectDir
            buildName = "lodgen-publish-${gameVersion}-${loaderName}"
            tasks = ['publishModrinth']
            startParameter.projectProperties = new LinkedHashMap(gradle.startParameter.projectProperties) + [mcVersion: gameVersion, loader: loaderName]
            startParameter.offline = gradle.startParameter.offline
            startParameter.refreshDependencies = gradle.startParameter.refreshDependencies
            startParameter.rerunTasks = gradle.startParameter.rerunTasks
            mustRunAfter('build')
            if (priorPublication != null) dependsOn(priorPublication)
        }
    }
}
tasks.register('publishModrinthAll') {
    group = 'publishing'
    description = 'Build, test, and publish every Minecraft/loader target in versions.json to Modrinth.'
    dependsOn(previousPublication)
}

if (integration) {
    def runDir = layout.buildDirectory.dir('run')
    def prepareServer = tasks.register('prepareIntegrationServer') {
        doLast {
            def directory = runDir.get().asFile
            directory.mkdirs()
            new File(directory, 'eula.txt').text = 'eula=true\n'
            new File(directory, 'server.properties').text = 'online-mode=false\nserver-port=0\nlevel-seed=123456789\nview-distance=2\nsimulation-distance=2\nmax-tick-time=180000\n'
        }
    }
    tasks.named('runServer') {
        dependsOn(prepareServer)
        workingDir(runDir)
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(target.java as int) }
        args '--nogui'
        jvmArgs '-Xmx2G'
    }
}
