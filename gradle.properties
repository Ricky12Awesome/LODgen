org.gradle.jvmargs=-Xmx3G
org.gradle.caching=true
org.gradle.parallel=false

# Shared metadata for every Minecraft version and loader.
modId=lodgen
modName=LODgen
modVersion=0.1.0-alpha
modGroup=dev.ricky12awesome.lodgen
modDescription=A mod that generates chunks without saving them so they can be used for generating LODs and not inflate world size
# Separate multiple authors with commas.
modAuthors=Ricky12Awesome
modLicense=MIT
modIcon=logo.png
modSourceUrl=https://github.com/Ricky12Awesome/LODgen
modHomepageUrl=https://github.com/Ricky12Awesome/LODgen
modIssueTrackerUrl=https://github.com/Ricky12Awesome/LODgen/issues

# Default build target.
mcVersion=1.21.1
loader=fabric
# Modrinth badges: Client-side, Server-side, and Client and server.
modrinthEnvironment=client_or_server_prefers_both
modrinthChangelogUrl=https://github.com/Ricky12Awesome/LODgen/blob/main/CHANGELOG.md

# Publish the selected target with credentials from .env or the environment:
# ./gradlew publishModrinth
# Publish every Minecraft/loader target in versions.json: ./gradlew publishModrinthAll
# Uses modVersion above; -alpha/-beta versions set the release type automatically.
# Add -PmodrinthDebug=true to preview without uploading.
# Optional: -PmcVersion=26.3 -Ploader=neoforge -PmodrinthChangelogUrl=<url>
