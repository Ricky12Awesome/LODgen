org.gradle.jvmargs=-Xmx3G
org.gradle.caching=true
org.gradle.parallel=false
modVersion=0.1.0-alpha
mcVersion=1.21.1
loader=fabric
# Modrinth badges: Client-side, Server-side, and Client and server.
modrinthEnvironment=client_or_server_prefers_both

# Publish the selected target with credentials from .env or the environment:
# ./gradlew publishModrinth
# Publish every Minecraft/loader target in versions.json: ./gradlew publishModrinthAll
# Uses modVersion above; -alpha/-beta versions set the release type automatically.
# Add -PmodrinthDebug=true to preview without uploading.
# Optional: -PmcVersion=26.3 -Ploader=neoforge -PmodrinthChangelogFile=path/to/changelog.md
